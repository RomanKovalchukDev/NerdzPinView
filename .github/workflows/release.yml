name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SCHEME: NerdzPinView

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  docs:
    name: Build and deploy DocC
    runs-on: macos-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build documentation
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/docc \
            2>&1 | tee docbuild.log
          if grep -iE '(^|[^/])(warning|error): ' docbuild.log | grep -v 'multiple matching'; then
            echo "DocC reported diagnostics" >&2
            exit 1
          fi

      - name: Transform for static hosting
        run: |
          archive="$(find .build/docc -name '*.doccarchive' -print -quit)"
          if [ -z "$archive" ]; then
            echo "No .doccarchive produced" >&2
            exit 1
          fi
          "$(xcrun --find docc)" process-archive transform-for-static-hosting "$archive" \
            --output-path _site \
            --hosting-base-path "${GITHUB_REPOSITORY#*/}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
