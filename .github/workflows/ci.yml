name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: >
          xcodebuild build
          -scheme NerdzPinView
          -destination 'generic/platform=iOS Simulator'

      - name: Select an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for r in d for x in d[r] if x.get('isAvailable') and x.get('name','').startswith('iPhone')]; print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found." >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: >
          xcodebuild test
          -scheme NerdzPinView
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          -enableCodeCoverage YES
